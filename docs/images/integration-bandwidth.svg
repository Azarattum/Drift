<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="360" viewBox="0 0 1400 360" role="img" aria-labelledby="title desc">
  <title id="title">Automatic bandwidth control and Full speed</title>
  <desc id="desc">Downloads slow down as other traffic grows. Full speed restores bandwidth for the selected download while other downloads remain limited.</desc>
  <rect width="1400" height="360" rx="16" fill="#19191c"/>
  <g fill="#e9e9ed" font-family="Inter, system-ui, sans-serif" font-size="22" font-weight="650">
    <text x="210" y="65">Quiet</text>
    <text x="615" y="65">Network busy</text>
    <text x="1050" y="65" fill="#9caaff">Full speed</text>
  </g>
  <g fill="none" stroke="#484850" stroke-width="1.5">
    <path d="M400 59h140m-6-5 6 5-6 5M830 59h140m-6-5 6 5-6 5"/>
    <!-- Lucide Zap (ISC), matching the app's Full speed icon. -->
    <path transform="translate(1015 44)" d="M15.914 4a1.5 1.5 0 00-2.474-1.561l-9 9A1.5 1.5 0 005.5 14h4.002a.5.5 0 01.471.666L8.086 20a1.5 1.5 0 002.475 1.56l9-9A1.5 1.5 0 0018.5 10h-3.997a.5.5 0 01-.472-.667z" stroke="#9caaff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <path d="M210 148H390C460 148 465 131 535 131H1240V165H535C465 165 460 152 390 152H210Z" fill="#65c5b1"/>
  <path d="M210 222H390C455 222 465 246 535 246H900C970 246 990 224 1050 224H1240V268H1050C990 268 970 250 900 250H535C465 250 455 274 390 274H210Z" fill="#9caaff"/>
  <path d="M535 248H890C955 248 965 306 1030 306H1240" fill="none" stroke="#9caaff" stroke-width="4" stroke-linecap="round"/>
  <g fill="#b7b7c4" font-family="Inter, system-ui, sans-serif" font-size="17">
    <text x="38" y="157">Other traffic</text>
    <text x="38" y="255">Downloads</text>
    <text x="1260" y="253" fill="#9caaff">Selected</text>
    <text x="1260" y="312">Others</text>
  </g>
</svg>
